[project]
name = "distorchmemorymanager"
description = "An independent memory management custom node for ComfyUI. Provides Distorch memory management functionality for efficient GPU/CPU memory handling."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["torch>=1.12.0", "psutil>=5.8.0"]

[project.urls]
Repository = "https://github.com/ussoewwin/ComfyUI-DistorchMemoryManager"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/ussoewwin/ComfyUI-DistorchMemoryManager/wiki"
"Bug Tracker" = "https://github.com/ussoewwin/ComfyUI-DistorchMemoryManager/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-DistorchMemoryManager"
Icon = ""
includes = [] 
