[project]
name = "ComfyUI-DistorchMemoryManager"
version = "2.4.10"
description = "An independent memory management custom node for ComfyUI. Provides Distorch memory management functionality for efficient GPU/CPU memory handling. Supports purging of SeedVR2, Qwen3-VL, Nunchaku models (FLUX/Z-Image/Qwen-Image), HSWQ INT8 (comfy_quant) models, and ModelPatchLoader workflows integrated directly into General Purge VRAM V2. Auto-detects non-PyTorch VRAM usage via NVML to prevent OOM errors in multi-process environments."
authors = [{ name = "ussoewwin" }]
license = { file = "LICENSE" }
requires-python = ">=3.10, <3.13"

[project.urls]
Repository = "https://github.com/ussoewwin/ComfyUI-DistorchMemoryManager"

[tool.comfy]
PublisherId = "ussoewwin"
DisplayName = "ComfyUI-VRAM-Manager"
Icon = "https://raw.githubusercontent.com/ussoewwin/ComfyUI-DistorchMemoryManager/main/icon.png"

